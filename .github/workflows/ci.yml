name: CI Pipeline

on:
  push:
    branches: [ main, perf-test ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/perf-test'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: jobqueue_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "backports.zoneinfo" req.txt > req_ci.txt
          pip install -r req_ci.txt

      - name: Run Migrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python manage.py migrate

      - name: Run Pytest
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m pytest tests/ -v

  perf-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/perf-test'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: jobqueue_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "backports.zoneinfo" req.txt > req_ci.txt
          pip install -r req_ci.txt
          pip install locust

      - name: Run Migrations
        run: python manage.py migrate

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          for i in {1..15}; do
            curl -sf http://localhost:8000/health/ && break
            echo "Waiting for Django..."
            sleep 2
          done

      - name: Start Celery worker
        run: |
          celery -A config worker \
            --loglevel=info \
            --concurrency=4 \
            -Q jobs.high,jobs.default,jobs.low &
          sleep 5

      - name: Prepare results folder
        id: results
        run: |
          FOLDER="perf-results/run-${{ github.run_number }}-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$FOLDER"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Run Locust smoke test
        run: |
          locust -f PerformanceTesting/locustfile.py \
            --headless \
            --host http://localhost:8000 \
            -u 30 -r 5 \
            --run-time 60s \
            --csv "${{ steps.results.outputs.folder }}/report" \
            --html "${{ steps.results.outputs.folder }}/report.html"

      - name: Check failure rate threshold
        run: |
          python - <<'EOF'
          import csv, sys
          path = "${{ steps.results.outputs.folder }}/report_stats.csv"
          with open(path) as f:
              rows = list(csv.DictReader(f))
          agg = next(r for r in rows if r["Name"] == "Aggregated")
          total = int(agg["Request Count"])
          fails = int(agg["Failure Count"])
          rate = (fails / total * 100) if total else 0
          print(f"Total: {total}, Failures: {fails}, Rate: {rate:.2f}%")
          if rate > 5:
              print("::error::Failure rate exceeded 5% threshold")
              sys.exit(1)
          EOF

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.run_number }}
          path: ${{ steps.results.outputs.folder }}
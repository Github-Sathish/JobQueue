name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "backports.zoneinfo" req.txt > req_ci.txt
          pip install -r req_ci.txt

      - name: Run Pytest
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          DATABASE_URL: ""
          REDIS_URL: ""
        run: |
          python -m pytest tests/ -v